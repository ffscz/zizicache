name: Feature request
description: An idea that would make ZiziCache better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ZiziCache help?
  - type: input
    id: setup
    attributes:
      label: Your setup (optional)
      placeholder: "WooCommerce shop on LiteSpeed with Cloudflare"
