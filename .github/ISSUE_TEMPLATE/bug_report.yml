name: Bug report
description: Something in ZiziCache does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove domains, e-mails, licence keys and tokens from anything you paste.
  - type: input
    id: version
    attributes:
      label: ZiziCache version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: WordPress, PHP and web server
      placeholder: "WordPress 6.9, PHP 8.3, LiteSpeed / Apache / Nginx"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Page cache / preload
        - LiteSpeed mode
        - Cloudflare / CDN
        - CSS / JavaScript
        - Images / fonts
        - Metrics (Core Web Vitals)
        - AI & MCP
        - Admin / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on ...
        2. Open ...
        3. See ...
  - type: textarea
    id: selftest
    attributes:
      label: Self test result or log lines
      description: See https://zizicache.com/doc/self-test-diagnostics/
      render: text
